[workspace]
members = ["crates/audio"]
resolver = "3"

[package]
name = "ngy-audio-player"
version = "0.1.0"
edition = "2024"
description = "跨平台音频播放器：基于 GPUI Kit，内置 Symphonia，系统 ffmpeg 兜底"
license = "Apache-2.0"

[lib]
name = "ngy_audio_player"
path = "src/lib.rs"

[[bin]]
name = "ngy-audio-player"
path = "src/main.rs"

[dependencies]
# UI / 渲染：基于 Zed GPUI 的综合性桌面框架（Apache-2.0）。
gpui-kit = "0.8"
anyhow = "1"

# 播放引擎（独立 crate，见 crates/audio）。
ngy-audio-engine = { path = "crates/audio" }

# 内嵌封面解码：jpeg/png/webp 足够覆盖常见专辑图。
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }

# 频谱可视化。
rustfft = "6"

# 原生文件 / 文件夹选择对话框。注意它是**阻塞**的，必须在后台线程上弹。
rfd = "0.15"

[dev-dependencies]
gpui-kit = { version = "0.8", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# GPUI 的布局 / 文本 / 渲染代码在未优化时慢到不可用，只对这几层开优化。
[profile.dev.package]
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }

# 音频解码 / 重采样在 debug 下若完全不优化，seek 与切歌会有明显延迟。
[profile.dev]
opt-level = 1
