# 工作区根只放清单，源码都在 crates 下：app 是界面层，audio 是音频内核。
[workspace]
members = ["crates/app", "crates/audio"]
resolver = "3"

# 编译配置必须留在工作区根清单里，成员 crate 里写无效。
[profile.release]
opt-level = 3
# 这里刻意不用 fat LTO + codegen-units=1：GPUI 依赖树很大，那种配置会让每个
# rustc（含 proc-macro 依赖）都带 linker-plugin-lto，单进程峰值到 GB 级，24 核
# 并行时直接把 Windows 提交内存打满（os error 1455）。thin LTO 保留跨 crate
# 优化，内存与耗时低一个数量级，播放器场景性能差异不可感知。
lto = "thin"
codegen-units = 16
strip = true

# GPUI 的布局 / 文本 / 渲染代码在未优化时慢到不可用，只对这几层开优化。
[profile.dev.package]
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }

# 音频解码 / 重采样在 debug 下若完全不优化，seek 与切歌会有明显延迟。
[profile.dev]
opt-level = 1
